<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Project Tracker</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f7f7f5; --panel: #ffffff; --fg: #1d1d1f; --muted: #6b6b70; --border: #e2e2e0;
  --code-bg: #f0f0ee;
  --todo: #9a9aa0; --prog: #c77700; --prog-bg: #fff4e0; --done: #2e7d32; --drop: #8a8a8a; --unk: #b3261e;
  --bar-bg: #e8e8e6; --warn-bg: #fff8e1; --warn-fg: #6d4c00; --err-bg: #fdecea; --err-fg: #8a1c14;
  --link: #1a5fb4; --hover: #f2f2ef;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161618; --panel: #1f1f22; --fg: #e8e8ea; --muted: #9a9aa2; --border: #303034;
    --code-bg: #2a2a2e;
    --todo: #7c7c84; --prog: #f0a531; --prog-bg: #3a2c12; --done: #66bb6a; --drop: #6f6f75; --unk: #ef6b5f;
    --bar-bg: #2c2c30; --warn-bg: #2e2810; --warn-fg: #e9cf7a; --err-bg: #3a1714; --err-fg: #f3a69e;
    --link: #8ab4f8; --hover: #26262a;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow-wrap: break-word; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
h1 { font-size: 18px; margin: 0 0 4px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
h2 .muted { text-transform: none; letter-spacing: 0; font-weight: 400; }
a { color: var(--link); }
/* Long paths/identifiers in code spans may break anywhere; ordinary words only break when a single word is wider than the line. */
code { font: 12px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--code-bg); padding: 1px 4px; border-radius: 3px; overflow-wrap: anywhere; word-break: normal; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; min-width: 0; }
.muted { color: var(--muted); }
.grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 14px; margin-bottom: 14px; }
.grid > .panel { margin-bottom: 0; }
@media (max-width: 760px) { .grid { grid-template-columns: minmax(0,1fr); } }
button.more { font: inherit; font-size: 12px; color: var(--link); background: none; border: 0; padding: 0; margin: 0; cursor: pointer; }
button.more:hover { text-decoration: underline; }

/* header */
.head { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; justify-content: space-between; }
.head > div { min-width: 0; }
.pct { font-size: 30px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1; }
.counts { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.meta { font-size: 12px; color: var(--muted); text-align: right; }
.meta .stale { color: var(--prog); font-weight: 600; }
.meta .verystale { color: var(--unk); font-weight: 600; }
.bigbar { margin-top: 12px; }

/* bars */
.bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--bar-bg); }
.bar span { display: block; height: 100%; }
.bar .s-done { background: var(--done); } .bar .s-in_progress { background: var(--prog); }
.bar .s-dropped { background: var(--drop); opacity: .5; } .bar .s-unknown { background: var(--unk); }

/* current phase */
.cur-head { display: grid; grid-template-columns: minmax(0,1fr) 140px auto; gap: 12px; align-items: center; margin-bottom: 4px; }
.cur-head .ttl { font-size: 15px; }
@media (max-width: 560px) { .cur-head { grid-template-columns: minmax(0,1fr) auto; } .cur-head .bar { grid-column: 1 / -1; order: 3; } }
.pdesc { font-size: 12px; color: var(--muted); margin: 2px 0 8px; }
.subhead { font-size: 12px; font-weight: 600; color: var(--muted); margin: 10px 0 4px; }

/* phases */
details.phase { border-top: 1px solid var(--border); }
details.phase:first-of-type { border-top: 0; }
details.phase > summary { list-style: none; cursor: pointer; padding: 8px 4px; margin: 0 -4px; border-radius: 5px; display: grid; grid-template-columns: minmax(0,1fr) 140px 84px; gap: 12px; align-items: center; }
details.phase > summary:hover { background: var(--hover); }
details.phase > summary::-webkit-details-marker { display: none; }
details.phase > summary .ttl::before { content: "\25B8"; display: inline-block; width: 14px; color: var(--muted); transition: transform .1s; }
details.phase[open] > summary .ttl::before { transform: rotate(90deg); }
details.phase > .pbody { padding-left: 14px; }
.ttl { font-weight: 600; min-width: 0; }
.ttl .pid { color: var(--muted); font-weight: 500; margin-right: 4px; }
.ttl .chip { font-weight: 500; font-size: 12px; margin-left: 6px; vertical-align: 1px; }
.frac { text-align: right; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 560px) {
  details.phase > summary { grid-template-columns: minmax(0,1fr) auto; }
  details.phase > summary .bar { grid-column: 1 / -1; order: 3; }
}

/* tasks: three columns (icon, id, body); everything else lives inside the body cell */
ul.tasks { list-style: none; margin: 0 0 10px; padding: 0; }
ul.tasks > li { display: grid; grid-template-columns: 18px 46px minmax(0,1fr); gap: 4px; padding: 3px 6px; border-radius: 5px; }
ul.tasks > li > .tid { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; padding-top: 1px; white-space: nowrap; }
ul.tasks > li > .body { min-width: 0; }
.ptag { color: var(--muted); font-size: 11px; display: block; }
ul.tasks > li.st-done .txt { color: var(--muted); }
ul.tasks > li.st-dropped .txt { color: var(--muted); text-decoration: line-through; }
ul.tasks > li.st-in_progress { background: var(--prog-bg); box-shadow: inset 3px 0 0 var(--prog); }
ul.tasks > li.st-in_progress .txt { font-weight: 550; }

/* task notes (sub-bullets): two columns (marker, text block) */
ul.sub { list-style: none; margin: 3px 0 2px; padding: 0; font-size: 12.5px; color: var(--muted); }
ul.sub > li { display: grid; grid-template-columns: 16px minmax(0,1fr); gap: 4px; padding: 2px 0; }
ul.sub > li > .nb { min-width: 0; }
ul.sub .ico { width: 12px; height: 12px; margin-top: 2px; }
ul.sub .ico.s-done::after { left: 3.5px; top: 1.5px; width: 2.5px; height: 5px; }
ul.sub .ico.s-dropped::after { top: 4px; }
ul.sub > li.st-dropped .cl { text-decoration: line-through; }
.dot { width: 12px; text-align: center; color: var(--muted); line-height: 1.45; }

/* clamped long text */
.cl.clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }

.ico { display: inline-block; width: 14px; height: 14px; border-radius: 50%; flex: none; margin-top: 2px; position: relative; }
.ico.s-todo { border: 1.5px solid var(--todo); }
.ico.s-in_progress { border: 1.5px solid var(--prog); background: linear-gradient(90deg, var(--prog) 50%, transparent 50%); }
.ico.s-done { background: var(--done); }
.ico.s-done::after { content: ""; position: absolute; left: 4.5px; top: 2px; width: 3px; height: 6px; border: solid var(--panel); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.ico.s-dropped { border: 1.5px solid var(--drop); }
.ico.s-dropped::after { content: ""; position: absolute; left: 2px; right: 2px; top: 5px; height: 1.5px; background: var(--drop); }
.ico.s-unknown { border: 1.5px dashed var(--unk); }

/* lists */
.item { padding: 6px 0; border-top: 1px solid var(--border); min-width: 0; }
.item:first-child { border-top: 0; padding-top: 0; }
.item .k { font-weight: 600; color: var(--muted); margin-right: 6px; font-variant-numeric: tabular-nums; }
.item .date { font-size: 12px; color: var(--muted); }
.item.resolved { color: var(--muted); }
.empty { color: var(--muted); font-style: italic; }
.intro { font-size: 12px; color: var(--muted); margin: -4px 0 8px; }
.tag { display: inline-block; font-size: 11px; font-weight: 500; padding: 0 6px; border-radius: 9px; border: 1px solid var(--border); color: var(--muted); margin-left: 4px; vertical-align: 1px; }
details.more-list > summary { cursor: pointer; font-size: 12px; color: var(--link); margin-top: 6px; }

/* running table */
table.run { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
table.run th { text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; padding: 0 8px 4px 0; }
table.run td { vertical-align: top; padding: 5px 8px 5px 0; border-top: 1px solid var(--border); min-width: 0; }
table.run col.c-what { width: 32%; } table.run col.c-status { width: 11%; } table.run col.c-cmd { width: 29%; } table.run col.c-out { width: 28%; }
table.run .what { font-weight: 600; }
.rst { font-weight: 600; }
.rst.live { color: var(--prog); } .rst.ok { color: var(--done); } .rst.bad { color: var(--unk); } .rst.other { color: var(--muted); }
@media (max-width: 640px) {
  table.run, table.run tbody, table.run tr, table.run td { display: block; width: auto; }
  table.run thead, table.run colgroup { display: none; }
  table.run tr { border-top: 1px solid var(--border); padding: 6px 0; }
  table.run tr:first-child { border-top: 0; }
  table.run td { border: 0; padding: 1px 0; }
  table.run td[data-l]::before { content: attr(data-l) " "; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .03em; margin-right: 4px; }
}

/* recent activity */
ol.recent { list-style: none; margin: 0; padding: 0; }
ol.recent > li { display: grid; grid-template-columns: 62px 96px 76px minmax(0,1fr); gap: 2px 8px; padding: 3px 0; font-size: 13px; border-top: 1px solid var(--border); }
ol.recent > li:first-child { border-top: 0; }
ol.recent .ago { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
ol.recent .lg { font-weight: 600; font-size: 12px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
ol.recent .tx { min-width: 0; }
@media (max-width: 640px) {
  ol.recent > li { grid-template-columns: auto auto minmax(0,1fr); }
  ol.recent .tx { grid-column: 1 / -1; }
}
.plogs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 12px; margin-top: 10px; }
.plog { min-width: 0; }
.plog h3 { font-size: 13px; margin: 0 0 4px; display: flex; justify-content: space-between; gap: 8px; }
.plog h3 .muted { font-weight: 400; font-size: 12px; white-space: nowrap; }
.plog ol { list-style: none; margin: 0; padding: 0; }
.plog li { display: grid; grid-template-columns: 74px minmax(0,1fr); gap: 6px; padding: 3px 0; font-size: 13px; }
.plog li > span { min-width: 0; }
.plog li:not(:first-child) { color: var(--muted); }
.pst { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; padding-top: 2px; }
.pst.started { color: var(--link); } .pst.milestone { color: var(--done); } .pst.blocked { color: var(--unk); }
.pst.done { color: var(--done); } .pst.unknown { color: var(--muted); }
.plog .when { font-size: 11px; font-weight: 400; color: var(--muted); display: block; text-transform: none; }

/* warnings / errors */
.warns { font-size: 12px; background: var(--warn-bg); color: var(--warn-fg); border-radius: 6px; padding: 6px 10px; margin-bottom: 14px; }
.warns summary { cursor: pointer; }
.warns ul { margin: 6px 0 2px; padding-left: 18px; }
.warns code { background: transparent; }
.err { background: var(--err-bg); color: var(--err-fg); border-radius: 6px; padding: 8px 12px; margin-bottom: 14px; font-size: 13px; }
.foot { font-size: 12px; color: var(--muted); text-align: center; padding: 8px 0 24px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div id="err" class="err" hidden></div>

  <section class="panel">
    <div class="head">
      <div>
        <h1 id="title">Tracker</h1>
        <div class="counts" id="counts"></div>
      </div>
      <div style="display:flex;gap:18px;align-items:center">
        <div class="pct" id="pct">–</div>
        <div class="meta" id="meta"></div>
      </div>
    </div>
    <div class="bar bigbar" id="bigbar"></div>
  </section>

  <div id="warns"></div>

  <section class="panel" id="current-panel" hidden>
    <h2>Current phase</h2>
    <div id="current"></div>
  </section>

  <section class="panel" id="running-panel">
    <h2>Running / monitoring</h2>
    <div class="intro" id="running-intro"></div>
    <div id="running"></div>
  </section>

  <section class="panel" id="progress-panel" hidden>
    <h2>Recent agent activity</h2>
    <div id="recent"></div>
    <details class="more-list ui" data-ui="alllogs">
      <summary id="alllogs-sum">All progress logs</summary>
      <div class="plogs" id="progress"></div>
    </details>
  </section>

  <section class="panel">
    <h2 id="plan-h">Plan</h2>
    <div id="phases"></div>
  </section>

  <div class="grid">
    <section class="panel">
      <h2>Open questions</h2>
      <div id="questions"></div>
    </section>
    <section class="panel">
      <h2>Decisions</h2>
      <div id="decisions"></div>
    </section>
  </div>

  <section class="panel notes">
    <h2>Notes log</h2>
    <div id="notes"></div>
  </section>

  <div class="foot" id="foot"></div>
</div>

<script>
(function () {
  "use strict";
  var REFRESH_MS = 10000;
  var RECENT_N = 8;
  var STATES = ["done", "in_progress", "todo", "dropped", "unknown"];
  var PSTATES = ["started", "milestone", "blocked", "done"];
  var LABELS = { done: "done", in_progress: "in progress", todo: "todo", dropped: "dropped", unknown: "unknown" };
  var MARKERS = { " ": "todo", "x": "done", "X": "done", "~": "in_progress", "-": "dropped" };
  var LS_PHASES = "tracker.phaseOpen.v1";
  var LS_UI = "tracker.ui.v1";
  var lastText = null;
  var lastData = null;
  var lastOk = null;
  var expanded = {}; // clamp key -> true while the user has "more" open (kept across refreshes)

  function $(id) { return document.getElementById(id); }

  function lsGet(k) {
    try { var v = window.localStorage.getItem(k); return v ? JSON.parse(v) || {} : {}; } catch (e) { return {}; }
  }
  function lsSet(k, v) {
    try { window.localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ }
  }
  var phaseOpen = lsGet(LS_PHASES); // phase key -> bool, only where the user differs from the default
  var uiOpen = lsGet(LS_UI);

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  // Minimal inline Markdown: code spans, **bold**, *em*, ~~strike~~, [text](http/#anchor).
  function md(s) {
    if (s == null) return "";
    var codes = [];
    var t = String(s).replace(/`([^`]+)`/g, function (_, c) {
      codes.push("<code>" + esc(c) + "</code>");
      return "\u0000" + (codes.length - 1) + "\u0000";
    });
    t = esc(t);
    t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    t = t.replace(/(^|[^*\w])\*([^*\s][^*]*)\*(?!\w)/g, "$1<em>$2</em>");
    t = t.replace(/~~([^~]+)~~/g, "<s>$1</s>");
    t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, label, href) {
      var raw = href.replace(/&amp;/g, "&");
      if (/^(https?:\/\/|#)/.test(raw)) return '<a href="' + esc(raw) + '" target="_blank" rel="noopener">' + label + "</a>";
      return label;
    });
    return t.replace(/\u0000(\d+)\u0000/g, function (_, i) { return codes[+i]; });
  }

  // A block of Markdown that is clamped to two lines, with a more/less toggle when it overflows.
  function clampBlock(key, html, tag) {
    tag = tag || "div";
    var open = !!expanded[key];
    return "<" + tag + ' class="cl' + (open ? "" : " clamp") + '" data-k="' + esc(key) + '">' + html + "</" + tag + ">" +
      '<button type="button" class="more" data-k="' + esc(key) + '"' + (open ? "" : " hidden") + ">" + (open ? "less" : "more") + "</button>";
  }

  // Show "more" only where the clamped text actually overflows. Elements in closed <details> have no size; skip them.
  function measure(root) {
    var els = (root || document).querySelectorAll(".cl");
    for (var i = 0; i < els.length; i++) {
      var el = els[i], btn = el.nextElementSibling;
      if (!btn || !btn.classList.contains("more")) continue;
      if (expanded[el.getAttribute("data-k")]) { el.classList.remove("clamp"); btn.hidden = false; btn.textContent = "less"; continue; }
      el.classList.add("clamp");
      if (!el.getClientRects().length) continue;
      btn.textContent = "more";
      btn.hidden = !(el.scrollHeight > el.clientHeight + 2);
    }
  }

  function ago(iso, now) {
    var t = Date.parse(iso);
    if (isNaN(t)) return null;
    var s = Math.max(0, Math.round((now - t) / 1000));
    if (s < 60) return s + "s ago";
    if (s < 3600) return Math.floor(s / 60) + "m ago";
    if (s < 86400) return Math.floor(s / 3600) + "h " + Math.floor((s % 3600) / 60) + "m ago";
    return Math.floor(s / 86400) + "d ago";
  }

  function bar(by, total) {
    if (!total) return "";
    return ["done", "in_progress", "dropped", "unknown"].map(function (k) {
      var n = (by && by[k]) || 0;
      return n ? '<span class="s-' + k + '" style="width:' + (100 * n / total) + '%" title="' + n + " " + LABELS[k] + '"></span>' : "";
    }).join("");
  }

  function icon(state) {
    var s = STATES.indexOf(state) >= 0 ? state : "unknown";
    return '<span class="ico s-' + s + '" title="' + LABELS[s] + '"></span>';
  }

  function list(arr, fn, emptyMsg) {
    if (!arr || !arr.length) return '<div class="empty">' + esc(emptyMsg) + "</div>";
    return arr.map(fn).join("");
  }

  function stateOf(t) { return STATES.indexOf(t.state) >= 0 ? t.state : "unknown"; }

  function counts(tasks) {
    var by = { todo: 0, in_progress: 0, done: 0, dropped: 0, unknown: 0 };
    (tasks || []).forEach(function (t) { by[stateOf(t)]++; });
    return by;
  }

  function phaseKey(p, i) { return p.id || "#" + i; }

  // Drop the ", delegated ...; acceptance = ..." tail from the heading when those are shown separately,
  // then split a long heading into a short title (first sentence) and the rest.
  function splitTitle(p) {
    var t = String(p.title || "");
    if (p.acceptance) t = t.replace(/[,;]?\s*acceptance\s*[=:].*$/i, "");
    if (p.delegated) t = t.replace(/[,;]?\s*delegated\b[^;]*$/i, "");
    t = t.trim() || String(p.title || "");
    if (t.length > 90) {
      var m = /^(.{15,}?)\.\s+(?=[A-Z*(`])/.exec(t);
      if (m) return [m[1], t.slice(m[0].length)];
    }
    return [t, ""];
  }

  // Notes may start with a checkbox marker ("[x] ...") for sub-tasks.
  function noteHtml(key, n, extraCls) {
    var m = /^\[([ xX~\-])\]\s+/.exec(String(n));
    var st = m ? MARKERS[m[1]] : null;
    var body = m ? String(n).slice(m[0].length) : String(n);
    return '<li class="' + (st ? "st-" + st : "") + (extraCls ? " " + extraCls : "") + '">' +
      (st ? icon(st) : '<span class="dot">&bull;</span>') +
      '<div class="nb">' + clampBlock(key, md(body)) + "</div></li>";
  }

  function taskHtml(t, opts) {
    opts = opts || {};
    var st = stateOf(t);
    var id = t.id || "?";
    var sub = (t.notes || []).map(function (n, i) { return noteHtml("n:" + id + ":" + i, n); }).join("");
    if (t.droppedReason) sub += noteHtml("dr:" + id, "dropped: " + t.droppedReason);
    if (st === "unknown" && t.marker) sub += '<li><span class="dot">!</span><div class="nb">unknown marker <code>[' + esc(t.marker) + "]</code></div></li>";
    return '<li class="st-' + st + '">' + icon(st) + '<span class="tid">' + esc(t.id || "–") + "</span>" +
      '<div class="body">' + (opts.phaseLabel ? '<span class="ptag">' + opts.phaseLabel + "</span>" : "") +
      clampBlock("t:" + id, md(t.text), "div").replace('class="cl', 'class="txt cl') +
      (sub ? '<ul class="sub">' + sub + "</ul>" : "") + "</div></li>";
  }

  function phaseCountsChips(by) {
    var out = "";
    if (by.in_progress) out += '<span class="chip" style="color:var(--prog)">' + icon("in_progress") + by.in_progress + " active</span>";
    if (by.todo) out += '<span class="chip muted">' + icon("todo") + by.todo + " todo</span>";
    if (by.unknown) out += '<span class="chip" style="color:var(--unk)">' + icon("unknown") + by.unknown + " unknown</span>";
    return out;
  }

  function fracHtml(by, total, pct) {
    return (by.done || 0) + "/" + (total - (by.dropped || 0)) + (pct != null ? " · " + pct + "%" : "");
  }

  // The current phase: the one with the most in-progress tasks (first in document order on a tie);
  // if nothing is in progress, the first phase that is not done.
  function pickCurrent(phases) {
    var best = -1, bestN = 0;
    phases.forEach(function (p, i) {
      var n = counts(p.tasks).in_progress;
      if (n > bestN) { best = i; bestN = n; }
    });
    if (best < 0) {
      for (var i = 0; i < phases.length; i++) if (phases[i].status !== "done") { best = i; break; }
    }
    return best;
  }

  function runStatusCls(s) {
    s = String(s || "").toLowerCase();
    if (/fail|error|block|stuck|dead|crash/.test(s)) return "bad";
    if (/done|finish|complete|ok\b|pass/.test(s)) return "ok";
    if (/run|serv|watch|active|progress|start|wait/.test(s)) return "live";
    return "other";
  }

  function renderMeta() {
    if (!lastData) return;
    var now = Date.now();
    var g = lastData.generatedAt, m = lastData.sourceMtime;
    var gAge = Date.parse(g);
    var cls = "";
    if (!isNaN(gAge)) {
      var mins = (now - gAge) / 60000;
      cls = mins > 60 ? "verystale" : mins > 10 ? "stale" : "";
    }
    var html = 'generated <span class="' + cls + '" title="' + esc(g) + '">' + esc(ago(g, now) || g || "?") + "</span>";
    if (m) html += '<br>source edited <span title="' + esc(m) + '">' + esc(ago(m, now) || m) + "</span>";
    if (lastOk) html += "<br>fetched " + esc(ago(new Date(lastOk).toISOString(), now));
    $("meta").innerHTML = html;
    var agos = document.querySelectorAll("[data-ago]");
    for (var i = 0; i < agos.length; i++) {
      var v = ago(agos[i].getAttribute("data-ago"), now);
      if (v) agos[i].textContent = v.replace(/ ago$/, "");
    }
  }

  function render(d) {
    var sum = d.summary || {};
    var phases = d.phases || [];
    var by = sum.byState || counts([].concat.apply([], phases.map(function (p) { return p.tasks || []; })));
    var total = sum.total != null ? sum.total : STATES.reduce(function (a, k) { return a + (by[k] || 0); }, 0);

    document.title = (sum.percentDone != null ? sum.percentDone + "% · " : "") + "Tracker";
    $("title").innerHTML = md(d.title || "Tracker");
    $("pct").textContent = sum.percentDone != null ? sum.percentDone + "%" : "–";
    $("counts").innerHTML = STATES.filter(function (k) { return k !== "unknown" || by[k]; }).map(function (k) {
      return '<span class="chip">' + icon(k) + "<b>" + (by[k] || 0) + "</b> " + LABELS[k] + "</span>";
    }).join("") + '<span class="chip muted">' + total + " tasks</span>";
    $("bigbar").innerHTML = bar(by, total);

    // parse warnings
    var w = d.parseWarnings || [];
    $("warns").innerHTML = w.length
      ? '<details class="warns"><summary>' + w.length + " parse warning" + (w.length > 1 ? "s" : "") + "</summary><ul>" +
        w.map(function (x) {
          return "<li><b>" + esc(x.section || "?") + (x.line ? ":" + esc(x.line) : "") + "</b> " + esc(x.message || "") +
            (x.raw ? " <code>" + esc(x.raw) + "</code>" : "") + "</li>";
        }).join("") + "</ul></details>"
      : "";

    var perPhase = {};
    (sum.perPhase || []).forEach(function (p) { perPhase[p.id] = p; });
    function pstats(p) {
      var pc = perPhase[p.id] || {};
      var pby = pc.byState || counts(p.tasks);
      var pt = pc.total != null ? pc.total : (p.tasks || []).length;
      return { by: pby, total: pt, pct: pc.percentDone };
    }

    // current phase: open work first, then what is already done in it
    var ci = pickCurrent(phases);
    $("current-panel").hidden = ci < 0;
    if (ci >= 0) {
      var cp = phases[ci], cs = pstats(cp), ct = splitTitle(cp), ck = phaseKey(cp, ci);
      var tasks = cp.tasks || [];
      var openT = tasks.filter(function (t) { var s = stateOf(t); return s === "in_progress" || s === "unknown"; })
        .concat(tasks.filter(function (t) { return stateOf(t) === "todo"; }));
      var closedT = tasks.filter(function (t) { var s = stateOf(t); return s === "done" || s === "dropped"; });
      var elsewhere = [];
      phases.forEach(function (p, i) {
        if (i === ci) return;
        (p.tasks || []).forEach(function (t) { if (stateOf(t) === "in_progress") elsewhere.push({ t: t, p: p }); });
      });
      var uiKey = "curdone:" + ck;
      $("current").innerHTML =
        '<div class="cur-head"><div class="ttl"><span class="pid">' + esc(cp.id || "") + "</span>" + md(ct[0]) +
        (cp.delegated ? '<span class="tag">delegated</span>' : "") + "</div>" +
        '<span class="bar">' + bar(cs.by, cs.total) + '</span><span class="frac">' + fracHtml(cs.by, cs.total, cs.pct) + "</span></div>" +
        ((ct[1] || cp.description || cp.acceptance) ? '<div class="pdesc">' + clampBlock("pd:" + ck,
          md(ct[1]) + (cp.description ? (ct[1] ? " " : "") + md(cp.description) : "") +
          (cp.acceptance ? (ct[1] || cp.description ? " · " : "") + "acceptance: " + md(cp.acceptance) : "")) + "</div>" : "") +
        (openT.length ? '<ul class="tasks">' + openT.map(function (t) { return taskHtml(t); }).join("") + "</ul>"
          : '<div class="empty">No open tasks in this phase.</div>') +
        (closedT.length ? '<details class="more-list ui" data-ui="' + esc(uiKey) + '"' + (uiOpen[uiKey] ? " open" : "") + "><summary>" +
          closedT.length + " done/dropped in " + esc(cp.id || "this phase") + '</summary><ul class="tasks">' +
          closedT.map(function (t) { return taskHtml(t); }).join("") + "</ul></details>" : "") +
        (elsewhere.length ? '<div class="subhead">Also in progress</div><ul class="tasks">' + elsewhere.map(function (x) {
          return taskHtml(x.t, { phaseLabel: esc(x.p.id || "") + " " + md(splitTitle(x.p)[0]) });
        }).join("") + "</ul>" : "");
    }

    // running
    $("running-intro").innerHTML = md(d.runningIntro || "");
    var run = d.running || [];
    $("running").innerHTML = run.length
      ? '<table class="run"><colgroup><col class="c-what"><col class="c-status"><col class="c-cmd"><col class="c-out"></colgroup>' +
        "<thead><tr><th>What</th><th>Status</th><th>Command</th><th>Output</th></tr></thead><tbody>" +
        run.map(function (r) {
          var extra = r.extra ? Object.keys(r.extra).map(function (k) { return '<div class="muted">' + esc(k) + ": " + md(r.extra[k]) + "</div>"; }).join("") : "";
          return '<tr><td class="what">' + md(r.what) + extra + "</td>" +
            '<td data-l="status"><span class="rst ' + runStatusCls(r.status) + '">' + md(r.status) + "</span></td>" +
            '<td data-l="command">' + md(r.command) + (r.taskRef ? ' <span class="muted">(' + esc(r.taskRef) + ")</span>" : "") + "</td>" +
            '<td data-l="output">' + md(r.output) + "</td></tr>";
        }).join("") + "</tbody></table>"
      : '<div class="empty">Nothing running.</div>';

    // progress logs: newest lines across all logs first, then every log in full
    var prog = d.progress || {};
    var names = Object.keys(prog).sort(function (a, b) {
      var ma = prog[a].mtime || "", mb = prog[b].mtime || "";
      return ma === mb ? (a < b ? -1 : 1) : (ma < mb ? 1 : -1);
    });
    $("progress-panel").hidden = names.length === 0;
    var all = [];
    names.forEach(function (n) {
      ((prog[n] || {}).entries || []).forEach(function (e, i) {
        var ts = Date.parse(e.timestamp);
        if (isNaN(ts)) ts = Date.parse(prog[n].mtime) - 1000 * (i + 1); // undated line: place it near the file's mtime
        all.push({ n: n, e: e, ts: isNaN(ts) ? 0 : ts });
      });
    });
    all.sort(function (a, b) { return b.ts - a.ts; });
    var nowMs = Date.now();
    $("recent").innerHTML = all.length ? '<ol class="recent">' + all.slice(0, RECENT_N).map(function (x) {
      var st = PSTATES.indexOf(x.e.status) >= 0 ? x.e.status : "unknown";
      var iso = x.e.timestamp || "";
      return '<li><span class="ago" title="' + esc(iso) + '"' + (iso ? ' data-ago="' + esc(iso) + '"' : "") + ">" +
        esc(iso ? (ago(iso, nowMs) || iso).replace(/ ago$/, "") : "?") + "</span>" +
        '<span class="lg" title="' + esc(x.n) + '">' + esc(x.n) + "</span>" +
        '<span class="pst ' + st + '">' + esc(st) + "</span>" +
        '<div class="tx">' + clampBlock("pr:" + x.n + ":" + iso, md(x.e.text)) + "</div></li>";
    }).join("") + "</ol>" : '<div class="empty">No progress entries.</div>';
    $("alllogs-sum").textContent = "All progress logs (" + names.length + ")";
    $("progress").innerHTML = names.map(function (n) {
      var lg = prog[n] || {}, ents = lg.entries || [];
      var latest = ents[0] || {};
      var lst = PSTATES.indexOf(latest.status) >= 0 ? latest.status : "unknown";
      return '<div class="plog"><h3><span>' + esc(n) + (latest.status ? ' <span class="pst ' + lst + '">' + esc(latest.status) + "</span>" : "") +
        '</span><span class="muted" title="' + esc(lg.mtime || "") + '">' + esc(lg.mtime ? (ago(lg.mtime, nowMs) || "") : "") + "</span></h3>" +
        (ents.length ? "<ol>" + ents.map(function (e, i) {
          var st = PSTATES.indexOf(e.status) >= 0 ? e.status : "unknown";
          var hm = e.timestamp && /T(\d{2}:\d{2})/.exec(e.timestamp);
          return '<li><span class="pst ' + st + '">' + esc(st) + '<span class="when" title="' + esc(e.timestamp || "") + '">' + esc(hm ? hm[1] + "Z" : "") +
            "</span></span><span>" + clampBlock("pl:" + n + ":" + i + ":" + (e.timestamp || ""), md(e.text)) + "</span></li>";
        }).join("") + "</ol>" : '<div class="empty">No entries yet.</div>') +
        (lg.lineCount > ents.length ? '<div class="muted" style="font-size:11px">' + esc(lg.lineCount) + " lines in " + esc(lg.file || n) + "</div>" : "") +
        "</div>";
    }).join("");

    // plan: every other phase, in document order. Finished phases start collapsed.
    var rest = [];
    phases.forEach(function (p, i) { if (i !== ci) rest.push({ p: p, i: i }); });
    $("plan-h").innerHTML = ci >= 0 ? 'Other phases <span class="muted">(' + esc(phases[ci].id || "current") + " is shown above)</span>" : "Plan";
    $("phases").innerHTML = list(rest, function (x) {
      var p = x.p, s = pstats(p), tt = splitTitle(p), key = phaseKey(p, x.i);
      var def = p.status !== "done";
      var open = phaseOpen.hasOwnProperty(key) ? !!phaseOpen[key] : def;
      return '<details class="phase" data-key="' + esc(key) + '" data-default="' + (def ? "1" : "0") + '"' + (open ? " open" : "") + ">" +
        '<summary><span class="ttl"><span class="pid">' + esc(p.id || "") + "</span>" + md(tt[0]) +
        (p.delegated ? '<span class="tag">delegated</span>' : "") + phaseCountsChips(s.by) +
        '</span><span class="bar">' + bar(s.by, s.total) + '</span><span class="frac">' + fracHtml(s.by, s.total, s.pct) + "</span></summary>" +
        '<div class="pbody">' +
        ((tt[1] || p.description || p.acceptance) ? '<div class="pdesc">' + clampBlock("pd:" + key,
          md(tt[1]) + (p.description ? (tt[1] ? " " : "") + md(p.description) : "") +
          (p.acceptance ? (tt[1] || p.description ? " · " : "") + "acceptance: " + md(p.acceptance) : "")) + "</div>" : "") +
        '<ul class="tasks">' + (p.tasks || []).map(function (t) { return taskHtml(t); }).join("") + "</ul></div></details>";
    }, "No other phases.");

    // questions (open first, resolved folded away), decisions
    var qs = d.openQuestions || [];
    var qOpen = qs.filter(function (q) { return !q.resolved; }), qDone = qs.filter(function (q) { return q.resolved; });
    function qHtml(q) {
      return '<div class="item' + (q.resolved ? " resolved" : "") + '">' + clampBlock("q:" + q.id, '<span class="k">' + esc(q.id) + "</span>" + md(q.text)) + "</div>";
    }
    $("questions").innerHTML = (qOpen.length ? qOpen.map(qHtml).join("") : '<div class="empty">No open questions.</div>') +
      (qDone.length ? '<details class="more-list ui" data-ui="qresolved"' + (uiOpen.qresolved ? " open" : "") + "><summary>" + qDone.length + " resolved</summary>" +
        qDone.map(qHtml).join("") + "</details>" : "");
    $("decisions").innerHTML = list(d.decisions, function (x) {
      return '<div class="item">' + clampBlock("d:" + x.id, '<span class="k">' + esc(x.id) + "</span>" + md(x.text) +
        (x.date ? ' <span class="date">' + esc(x.date) + "</span>" : "")) + "</div>";
    }, "No decisions.");

    // notes (already newest first per schema; sort defensively)
    var notes = (d.notes || []).slice().sort(function (a, b) {
      var da = a.date || "", db = b.date || "";
      if (da !== db) return da < db ? 1 : -1;
      return (b.seq || 0) - (a.seq || 0);
    });
    $("notes").innerHTML = list(notes, function (n) {
      return '<div class="item">' + clampBlock("g:" + n.seq, '<span class="date">' + esc(n.date || "undated") + "</span> " + md(n.text)) + "</div>";
    }, "No notes.");

    $("foot").textContent = "Auto-refreshes every " + (REFRESH_MS / 1000) + "s from tracker.json" +
      (d.source && d.source.sha256 ? " · source " + d.source.sha256.slice(0, 10) : "");

    var ui = document.querySelectorAll("details.ui[data-ui]");
    for (var i = 0; i < ui.length; i++) if (uiOpen[ui[i].getAttribute("data-ui")]) ui[i].open = true;
  }

  // Remember phase and section open/closed state (localStorage; only deviations from the default are stored for phases).
  document.addEventListener("toggle", function (e) {
    var el = e.target;
    if (!el || !el.classList) return;
    if (el.classList.contains("phase")) {
      var key = el.getAttribute("data-key"), def = el.getAttribute("data-default") === "1";
      if (el.open === def) delete phaseOpen[key]; else phaseOpen[key] = el.open;
      lsSet(LS_PHASES, phaseOpen);
    } else if (el.classList.contains("ui")) {
      var k = el.getAttribute("data-ui");
      if (el.open) uiOpen[k] = true; else delete uiOpen[k];
      lsSet(LS_UI, uiOpen);
    }
    if (el.open) measure(el);
  }, true);

  document.addEventListener("click", function (e) {
    var b = e.target && e.target.closest ? e.target.closest("button.more") : null;
    if (!b) return;
    e.preventDefault();
    e.stopPropagation();
    var k = b.getAttribute("data-k");
    if (expanded[k]) delete expanded[k]; else expanded[k] = true;
    var el = b.previousElementSibling;
    if (el && el.classList.contains("cl")) measure(el.parentNode);
  });

  var rt = null;
  window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () { measure(); }, 150); });

  function showErr(msg) {
    var el = $("err");
    if (msg) { el.textContent = msg; el.hidden = false; } else { el.hidden = true; }
  }

  function load() {
    fetch("tracker.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      })
      .then(function (text) {
        lastOk = Date.now();
        if (text === lastText) { showErr(null); renderMeta(); return; }
        var d = JSON.parse(text); // throws on a half-written or invalid file; we keep the last good render
        var x = window.scrollX, y = window.scrollY;
        render(d);
        measure();
        window.scrollTo(x, y);
        lastText = text;
        lastData = d;
        renderMeta();
        showErr(null);
      })
      .catch(function (e) {
        showErr("Could not load tracker.json (" + e.message + ")" + (lastData ? "; showing last good data." : "."));
        renderMeta();
      });
  }

  load();
  setInterval(load, REFRESH_MS);
  setInterval(renderMeta, 5000);
})();
</script>
</body>
</html>
