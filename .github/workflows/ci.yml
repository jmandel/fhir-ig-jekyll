name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / JDK ${{ matrix.java }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ['17', '21']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4   # submodules aren't needed to build or test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Build
        run: shim/build.sh
      - name: Expose the repo at /w (the YAML file-case suites hold oracle-container paths)
        if: runner.os == 'Linux'
        run: |
          sudo ln -s "$GITHUB_WORKSPACE" /w
          echo "SHIM_W_SUITES=1" >> "$GITHUB_ENV"
      - name: Differential suites (vs recorded Ruby output)
        run: SHIM_NO_BUILD=1 scripts/test-suites.sh
      - name: In-process API and IncludeProvider checks
        run: java -cp "shim/build/classes${{ runner.os == 'Windows' && ';' || ':' }}shim/build/test-classes" org.hl7.fhir.jekyll.test.site.ShimApiCheck
      - name: End to end through the wrapper (vs real Jekyll output)
        run: scripts/e2e.sh
