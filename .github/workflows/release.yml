name: Release

# Push a tag like v0.1.0 to publish a GitHub Release with:
#   shim.jar             the shim itself (java -jar shim.jar build --destination <dir>)
#   fhir-ig-jekyll.zip   shim.jar + jekyll-shim (Unix) + jekyll-shim.cmd (Windows) + docs and licenses
# Asset names don't carry the version, so .../releases/latest/download/shim.jar always works.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build a release for
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'   # class files target Java 17; runs on 17+
      - name: Build
        run: shim/build.sh
      - name: Test
        run: |
          sudo ln -s "$GITHUB_WORKSPACE" /w
          SHIM_NO_BUILD=1 SHIM_W_SUITES=1 scripts/test-suites.sh
      - name: Package
        run: |
          D=dist/fhir-ig-jekyll
          mkdir -p "$D"
          cp shim/build/shim.jar shim/jekyll-shim shim/jekyll-shim.cmd "$D/"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md shim/INTEGRATION.md "$D/"
          chmod +x "$D/jekyll-shim"
          scripts/e2e.sh "$D"
          (cd dist && zip -qr fhir-ig-jekyll.zip fhir-ig-jekyll)
          cp shim/build/shim.jar dist/shim.jar
          (cd dist && sha256sum shim.jar fhir-ig-jekyll.zip > SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Drop-in for the IG Publisher's Jekyll stage. Requires Java 17+.

          Quick start:
              unzip fhir-ig-jekyll.zip
              java -jar publisher.jar -ig . -jekyll \$PWD/fhir-ig-jekyll/jekyll-shim          # Linux/macOS
              java -jar publisher.jar -ig . -jekyll C:\\path\\to\\fhir-ig-jekyll\\jekyll-shim.cmd   # Windows

          Or run it directly in a Jekyll source folder: java -jar shim.jar build --destination <dir>"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/shim.jar dist/fhir-ig-jekyll.zip dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" dist/shim.jar dist/fhir-ig-jekyll.zip dist/SHA256SUMS --title "$TAG" --notes "$notes"
          fi
